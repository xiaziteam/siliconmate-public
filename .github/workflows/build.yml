name: Build SiliconMate

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build Tauri app
        working-directory: client
        run: npx tauri build

      - name: Upload DMG (Intel x64)
        uses: actions/upload-artifact@v4
        with:
          name: siliconmate-mac-intel
          path: client/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  build-mac-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build Tauri app
        working-directory: client
        run: npx tauri build

      - name: Upload DMG (Apple Silicon aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: siliconmate-mac-arm
          path: client/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build Tauri app (NSIS)
        working-directory: client
        env:
          TAURI_BUNDLE_TARGETS: nsis
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: siliconmate-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libsoup-3.0-dev javascriptcoregtk-4.1-dev \
            libpipewire-0.3-dev libdbus-1-dev libxdo-dev libxkbcommon-dev \
            libgbm-dev libdrm-dev libwayland-dev libx11-dev libxcb1-dev

      - name: Install frontend deps
        working-directory: client
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm ci

      - name: Build Tauri app
        working-directory: client
        run: npm run tauri build

      - name: Upload AppImage & deb
        uses: actions/upload-artifact@v4
        with:
          name: siliconmate-linux
          path: |
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30
