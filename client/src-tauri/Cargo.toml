[package]
name = "siliconmate"
version = "4.2.2"
edition = "2021"
description = "硅侣3.0 — 双Agent极简AI助手 (V2+V1融合)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"
url = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
base64 = "0.22"
tungstenite = "0.24"
account-client = { path = "account-client" }
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Nuphus DesktopClient integration (Agent capability engine)
# desktop-api provides DesktopApi/SessionManager for Computer Use
# On macOS, native_cmds provide primary capability; nuphus adds deep Computer Use when available
nuphus = { path = "crates/nuphus" }
desktop-api = { path = "crates/desktop-api" }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"
parking_lot = "0.12"
arboard = "3"
objc2 = { version = "0.5", features = ["exception"] }
block2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
soup3 = "0.5"
gio = "0.20"

[[bin]]
name = "siliconmate"
path = "src/main.rs"

[profile.dev]
debug = 0
split-debuginfo = "unpacked"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
