name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev javascriptcoregtk-4.1-dev libpipewire-0.3-dev libdbus-1-dev libxdo-dev libxkbcommon-dev libgbm-dev libdrm-dev libwayland-dev libx11-dev libxcb1-dev

      - name: Replace server host with secret
        if: env.SERVER_HOST != ''
        run: |
          SERVER_HOST="${SERVER_HOST}" find . -type f \( -name '*.rs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.kt' \) \
            ! -path '*/node_modules/*' ! -path '*/target/*' ! -path '*/.git/*' \
            -exec sed -i "s/example\.com/${SERVER_HOST}/g" {} +

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Build Tauri app (AppImage + deb)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'SiliconMate v__VERSION__'
          releaseBody: '硅侣 v__VERSION__ — Linux'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SiliconMate-Linux
          path: |
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/deb/*.deb
