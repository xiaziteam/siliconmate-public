name: Build All Platforms (Private - manual only)

on:
  workflow_dispatch:

# 私有仓库CI已关闭自动触发，日常构建走公有仓 xiaziteam/siliconmate-open（无限额度）
# 仅紧急时手动触发

permissions:
  contents: write

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace server host with secret
        if: env.SERVER_HOST != ''
        run: |
          SERVER_HOST="${SERVER_HOST}" find . -type f \( -name '*.rs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.kt' \) \
            ! -path '*/node_modules/*' ! -path '*/target/*' ! -path '*/.git/*' \
            -exec sed -i "s/example\.com/${SERVER_HOST}/g" {} +

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Copy frontend to Android assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -R client/dist/* android/app/src/main/assets/dist/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconMate-Android
          path: android/app/build/outputs/apk/debug/*.apk

  build-macos:
    needs: build-android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace server host with secret
        if: env.SERVER_HOST != ''
        run: |
          SERVER_HOST="${SERVER_HOST}" find . -type f \( -name '*.rs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.kt' \) \
            ! -path '*/node_modules/*' ! -path '*/target/*' ! -path '*/.git/*' \
            -exec sed -i '' "s/example\.com/${SERVER_HOST}/g" {} +

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Checkout nuphus (path dependency)
        run: |
          git init /Users/apple/nuphus
          git -C /Users/apple/nuphus remote add origin https://github.com/mrpulor-gh/nuphus.git
          git -C /Users/apple/nuphus fetch --depth 1 origin tag v0.2.3
          git -C /Users/apple/nuphus checkout v0.2.3

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'SiliconMate v__VERSION__'
          releaseBody: '硅侣 v__VERSION__ — 全平台构建'
          releaseDraft: true
          args: --target aarch64-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconMate-macOS-arm64
          path: client/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-linux:
    needs: build-android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libgbm-dev

      - name: Replace server host with secret
        if: env.SERVER_HOST != ''
        run: |
          SERVER_HOST="${SERVER_HOST}" find . -type f \( -name '*.rs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.kt' \) \
            ! -path '*/node_modules/*' ! -path '*/target/*' ! -path '*/.git/*' \
            -exec sed -i "s/example\.com/${SERVER_HOST}/g" {} +

      - name: Checkout nuphus (path dependency)
        run: |
          sudo mkdir -p /Users/apple
          sudo chown -R $(whoami) /Users/apple
          git init /Users/apple/nuphus
          git -C /Users/apple/nuphus remote add origin https://github.com/mrpulor-gh/nuphus.git
          git -C /Users/apple/nuphus fetch --depth 1 origin tag v0.2.3
          git -C /Users/apple/nuphus checkout v0.2.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'SiliconMate v__VERSION__'
          releaseBody: '硅侣 v__VERSION__ — Linux'
          releaseDraft: true
          args: ""

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SiliconMate-Linux
          path: |
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    needs: build-android
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Replace server host with secret
        if: env.SERVER_HOST != ''
        run: |
          SERVER_HOST="${SERVER_HOST}" find . -type f \( -name '*.rs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.kt' \) \
            ! -path '*/node_modules/*' ! -path '*/target/*' ! -path '*/.git/*' \
            -exec sed -i "s/example\.com/${SERVER_HOST}/g" {} +

      - name: Checkout nuphus (path dependency)
        run: |
          # Cargo.toml path dep /Users/apple/nuphus/src 在 Windows 解析为当前盘符根。
          # workspace 在 D: → cargo 实际找 D:\Users\apple\nuphus\src；
          # 同时镜像到 C:\Users\apple 覆盖与 mac/linux 一致的字面路径。
          mkdir -p /c/Users/apple /d/Users/apple
          git init /c/Users/apple/nuphus
          git -C /c/Users/apple/nuphus remote add origin https://github.com/mrpulor-gh/nuphus.git
          git -C /c/Users/apple/nuphus fetch --depth 1 origin tag v0.2.3
          git -C /c/Users/apple/nuphus checkout v0.2.3
          cp -R /c/Users/apple/nuphus /d/Users/apple/nuphus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'SiliconMate v__VERSION__'
          releaseBody: '硅侣 v__VERSION__ — Windows'
          releaseDraft: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SiliconMate-Windows
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi

  publish-release:
    needs: [build-android, build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
